# Dashboard theme. Native Streamlit theming on purpose - DataModel.md
# forbids unsafe_allow_html anywhere in this app, because attacker-authored
# text (attack prompts, agent responses, session turns) is rendered here and
# prompt-injection payloads are routinely written to look like markup. CSS
# injection would mean turning that switch on, so the theme is expressed in
# config instead and the rule stays absolute.
#
# Palette reads as a monitoring console: near-black navy ground, one cool
# accent for interactive elements, and semantic red/green/orange reserved
# for outcomes (bypassed / defended / errored) so colour always carries
# meaning rather than decoration.

[theme]
base = "dark"
backgroundColor = "#0A0F1C"
secondaryBackgroundColor = "#131C2E"
primaryColor = "#38BDF8"
textColor = "#E6EDF7"
linkColor = "#7DD3FC"
borderColor = "#22304A"
showWidgetBorder = true
baseRadius = "0.5rem"
font = "sans-serif"
codeFont = "monospace"

# Outcome semantics, used by st.badge and coloured text.
redColor = "#F87171"       # bypassed - a real defeat of a guardrail
greenColor = "#4ADE80"     # defended
orangeColor = "#FBBF24"    # errored - never scored, excluded from ASR
violetColor = "#C084FC"

# Charts: the drift feed plots total vs flagged, so the first two entries
# carry the meaning and need to stay distinguishable.
chartCategoricalColors = ["#38BDF8", "#F87171", "#4ADE80", "#FBBF24", "#C084FC", "#94A3B8"]

[server]
headless = true
